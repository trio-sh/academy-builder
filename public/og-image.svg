<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0713"/>
      <stop offset="50%" stop-color="#1A0B33"/>
      <stop offset="100%" stop-color="#0B0713"/>
    </linearGradient>
    <linearGradient id="text-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="blob-indigo" cx="200" cy="500" r="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob-purple" cx="1000" cy="150" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob-pink" cx="900" cy="530" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 L0 0 0 60" fill="none" stroke="#6366F1" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Dark canvas + grid overlay -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glow blobs -->
  <rect width="1200" height="630" fill="url(#blob-indigo)"/>
  <rect width="1200" height="630" fill="url(#blob-purple)"/>
  <rect width="1200" height="630" fill="url(#blob-pink)"/>

  <!-- Top accent rule -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#text-accent)"/>

  <!-- Badge pill -->
  <g transform="translate(80, 90)">
    <rect x="0" y="0" width="380" height="44" rx="22" fill="#6366F1" fill-opacity="0.15" stroke="#6366F1" stroke-opacity="0.45" stroke-width="1"/>
    <!-- sparkle -->
    <path d="M22 22 L26 14 L30 22 L38 22 L32 27 L34 35 L26 30 L18 35 L20 27 L14 22 Z" fill="#A5B4FC" fill-opacity="0.9" transform="scale(0.5) translate(20 20)"/>
    <text x="46" y="29" font-family="Poppins, 'Helvetica Neue', Arial, sans-serif"
          font-size="16" font-weight="500" fill="#C7D2FE" letter-spacing="0.5">
      Workplace-Ready Behavioral Documentation
    </text>
  </g>

  <!-- Shield seal on the right -->
  <g transform="translate(970, 155)">
    <path d="M75 0 L145 30 L145 88 Q145 148 75 178 Q5 148 5 88 L5 30 Z" fill="url(#shield)"/>
    <path d="M75 14 L134 40 L134 86 Q134 138 75 162 Q16 138 16 86 L16 40 Z" fill="#0B0713" opacity="0.55"/>
    <text x="75" y="110" font-family="Poppins, 'Helvetica Neue', Arial, sans-serif"
          font-size="80" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
    <path d="M50 130 L68 145 L104 108" stroke="#10B981" stroke-width="6" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Headline -->
  <g transform="translate(80, 220)">
    <text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif"
          font-size="80" font-weight="800" fill="#FFFFFF" letter-spacing="-2">
      <tspan x="0" y="0">Beyond</tspan>
      <tspan x="0" y="90">Credentials.</tspan>
    </text>
    <text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif"
          font-size="76" font-weight="800" fill="url(#text-accent)" letter-spacing="-2">
      <tspan x="0" y="180">Behavioral Workplace</tspan>
      <tspan x="0" y="266">Readiness.</tspan>
    </text>
  </g>

  <!-- Bottom rule -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#text-accent)"/>

  <!-- Footer meta -->
  <g transform="translate(80, 585)">
    <text font-family="'JetBrains Mono', ui-monospace, monospace"
          font-size="15" font-weight="500" fill="#94A3B8" letter-spacing="2">
      the3rdacademy.com
    </text>
  </g>
  <g transform="translate(1120, 585)">
    <text font-family="'JetBrains Mono', ui-monospace, monospace"
          font-size="15" font-weight="500" fill="#A5B4FC" letter-spacing="2" text-anchor="end">
      ● LIVE · Aug 22 2026
    </text>
  </g>
</svg>
