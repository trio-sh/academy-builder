<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <!-- Paper grain: subtle noise-like speckle via repeating dots -->
    <pattern id="grain" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#EFE9DA"/>
      <circle cx="1" cy="1" r="0.35" fill="#1D1815" fill-opacity="0.05"/>
      <circle cx="4" cy="3.5" r="0.28" fill="#1D1815" fill-opacity="0.04"/>
    </pattern>
    <!-- Ledger rule lines: very faint horizontal ruling every 24px -->
    <pattern id="rule" x="0" y="0" width="1200" height="24" patternUnits="userSpaceOnUse">
      <rect width="1200" height="24" fill="none"/>
      <line x1="0" y1="24" x2="1200" y2="24" stroke="#1D1815" stroke-opacity="0.05" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Warm paper base -->
  <rect width="1200" height="630" fill="url(#grain)"/>
  <rect width="1200" height="630" fill="url(#rule)"/>

  <!-- Deckle edge — top thin ink rule -->
  <line x1="60" y1="60" x2="1140" y2="60" stroke="#1D1815" stroke-width="1"/>
  <!-- Bottom rule -->
  <line x1="60" y1="570" x2="1140" y2="570" stroke="#1D1815" stroke-width="1"/>

  <!-- ── Masthead row ─────────────────────────────────────────── -->
  <!-- Left: mono label -->
  <text x="72" y="98" font-family="'JetBrains Mono', 'Menlo', 'Consolas', monospace"
        font-size="14" font-weight="500" fill="#1D1815" fill-opacity="0.65"
        letter-spacing="2.5" text-transform="uppercase">§ REGISTER · VOLUME I</text>
  <!-- Right: date stamp -->
  <text x="1128" y="98" font-family="'JetBrains Mono', 'Menlo', 'Consolas', monospace"
        font-size="14" font-weight="500" fill="#1D1815" fill-opacity="0.65"
        letter-spacing="2.5" text-anchor="end">STAMPED · 12 · VIII · MMXXVI</text>

  <!-- Thick brand rule -->
  <line x1="60" y1="120" x2="1140" y2="120" stroke="#1D1815" stroke-width="2"/>

  <!-- ── Wordmark ────────────────────────────────────────────── -->
  <!-- Vermilion seal on the left (rotated disc) -->
  <g transform="translate(120, 200) rotate(-6)">
    <circle cx="60" cy="60" r="60" fill="#B84A22"/>
    <circle cx="60" cy="60" r="52" fill="none" stroke="#EFE9DA" stroke-width="1.5" stroke-opacity="0.9"/>
    <text x="60" y="79" font-family="Georgia, 'Times New Roman', serif"
          font-size="60" font-weight="700" font-style="italic" fill="#EFE9DA"
          text-anchor="middle">3</text>
  </g>

  <!-- Serif display: The 3rd Academy -->
  <text x="270" y="215" font-family="Georgia, 'Times New Roman', serif"
        font-size="72" font-weight="600" fill="#1D1815" letter-spacing="-1.5">The 3rd</text>
  <text x="270" y="285" font-family="Georgia, 'Times New Roman', serif"
        font-size="72" font-weight="500" font-style="italic" fill="#B84A22" letter-spacing="-1.5">Academy.</text>

  <!-- Marginalia rule under wordmark -->
  <line x1="270" y1="310" x2="410" y2="310" stroke="#B84A22" stroke-width="2"/>

  <!-- ── Lede ────────────────────────────────────────────────── -->
  <text x="270" y="360" font-family="Georgia, 'Times New Roman', serif"
        font-size="28" font-weight="400" fill="#1D1815" fill-opacity="0.82">
    Observed conduct — recorded, not inferred.
  </text>
  <text x="270" y="398" font-family="Georgia, 'Times New Roman', serif"
        font-size="22" font-weight="400" fill="#55504A">
    A public register of behavioral evidence for the workplace.
  </text>

  <!-- ── Ledger columns ──────────────────────────────────────── -->
  <!-- Column separator lines -->
  <line x1="60" y1="450" x2="1140" y2="450" stroke="#1D1815" stroke-opacity="0.3" stroke-width="0.75"/>

  <g transform="translate(72, 490)">
    <!-- Col 1 -->
    <text font-family="'JetBrains Mono', 'Menlo', 'Consolas', monospace"
          font-size="11" font-weight="500" fill="#1D1815" fill-opacity="0.65"
          letter-spacing="2">§ I · METHOD</text>
    <text y="26" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1D1815">
      Sustained mentor
    </text>
    <text y="50" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1D1815">
      observation.
    </text>
  </g>

  <g transform="translate(432, 490)">
    <text font-family="'JetBrains Mono', 'Menlo', 'Consolas', monospace"
          font-size="11" font-weight="500" fill="#1D1815" fill-opacity="0.65"
          letter-spacing="2">§ II · INSTRUMENT</text>
    <text y="26" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1D1815">
      Behavioral
    </text>
    <text y="50" font-family="Georgia, 'Times New Roman', serif" font-size="19"
          font-style="italic" fill="#B84A22">
      Evidence Report.
    </text>
  </g>

  <g transform="translate(792, 490)">
    <text font-family="'JetBrains Mono', 'Menlo', 'Consolas', monospace"
          font-size="11" font-weight="500" fill="#1D1815" fill-opacity="0.65"
          letter-spacing="2">§ III · REGISTER</text>
    <text y="26" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1D1815">
      Publicly verifiable —
    </text>
    <text y="50" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1D1815">
      status only.
    </text>
  </g>

  <!-- Bottom URL rule -->
  <line x1="60" y1="600" x2="1140" y2="600" stroke="#1D1815" stroke-width="1"/>
  <text x="72" y="622" font-family="'JetBrains Mono', 'Menlo', 'Consolas', monospace"
        font-size="12" font-weight="500" fill="#1D1815" fill-opacity="0.7"
        letter-spacing="2">the3rdacademy.com</text>
  <text x="1128" y="622" font-family="'JetBrains Mono', 'Menlo', 'Consolas', monospace"
        font-size="12" font-weight="500" fill="#B84A22"
        letter-spacing="2" text-anchor="end">§ VERIFIED AT /verify</text>
</svg>
