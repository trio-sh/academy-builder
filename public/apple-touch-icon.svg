<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180" fill="none">
  <!-- iOS applies its own corner mask; we still fill the full square with paper -->
  <rect width="180" height="180" fill="#EFE9DA"/>
  <!-- Faint ledger rule to echo the site voice at close inspection -->
  <line x1="20" y1="30" x2="160" y2="30" stroke="#1D1815" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="20" y1="150" x2="160" y2="150" stroke="#1D1815" stroke-opacity="0.15" stroke-width="1"/>
  <!-- Vermilion seal disc -->
  <g transform="translate(90 90) rotate(-6)">
    <circle r="60" fill="#B84A22"/>
    <circle r="52" fill="none" stroke="#EFE9DA" stroke-opacity="0.9" stroke-width="1.5"/>
    <text x="0" y="26" font-family="Georgia, 'Times New Roman', serif"
          font-size="80" font-weight="700" font-style="italic"
          fill="#EFE9DA" text-anchor="middle">3</text>
  </g>
</svg>
