name: CI
# Nothing merges untested: unit and component tests, the vocabulary and name checks, the build, and the database integration tests
# against a throwaway Postgres built from supabase/migrations. Add this workflow's jobs as required checks on main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run check:vocabulary
      - run: npm run check:names
      - run: python3 tools/day1/forbidden_ratchet.py
      - run: npm test
      - run: npx vite build

  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: ci
      PGL_HOST: localhost
      PGL_PORT: "5432"
      PGL_USER: neondb_owner
      T3A_TEST_DB_URL: postgresql://neondb_owner:ci@localhost:5432/t3a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm i --no-save pg
      - name: Create the throwaway database
        run: |
          psql -h localhost -U postgres -c "create role neondb_owner superuser login password 'ci'"
          psql -h localhost -U postgres -c "create database t3a owner neondb_owner"
      - name: Build it from the migrations
        env:
          T3A_BUILD_LOG: /tmp/t3a_build.log
        run: bash tools/nonprod-replay/local_pg/build.sh
      - name: Run the database tests
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: |
          set -o pipefail
          npm run test:db 2>&1 | tee /tmp/dbtest.log
      - name: Report a failure on the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '**CI database job failed.**'; echo
            echo "Server: $(psql -h localhost -U postgres -Atc 'select version()' | cut -c1-90)"; echo
            echo 'Build, files that reported errors (pass 1 then pass 2):'; echo '```'
            grep -E '^pass[12]' /tmp/t3a_build.log | grep -v 'errors=0' | sed 's/^pass/p/' | head -90; echo '```'; echo
            echo 'Row counts after the build:'; echo '```'
            psql -h localhost -U neondb_owner -d t3a -Atc "select 'content_objects', count(*) from t3a_content_object union all select 'content_versions', count(*) from t3a_d1_content_version union all select 'determinations', count(*) from t3a_determination union all select 'migrations_listed', 0" 2>&1 | head -10; echo '```'; echo
            echo 'Failing test lines:'; echo '```'
            grep -E "FAIL|×|→" /tmp/dbtest.log | cut -c1-400 | head -30; echo '```'; echo; echo '---'
            echo '_Generated by [Claude Code](https://claude.ai/code)_'
          } > /tmp/comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/comment.md
